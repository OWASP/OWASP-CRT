name: Generate Certificate

on:
  workflow_dispatch:
    inputs:
      full_name:
        description: 'Full Name'
        required: true
        type: string
      github_user:
        description: 'GitHub Username'
        required: true
        type: string
      github_id:
        description: 'GitHub User ID'
        required: true
        type: string

concurrency:
  group: cert-request-${{ inputs.github_user }}
  cancel-in-progress: true

jobs:
  build-cert:
    runs-on: ubuntu-latest
    permissions:
      contents: write 
    
    steps:
      - name: Checkout Main Repository
        uses: actions/checkout@v4

      - name: Checkout Data Branch
        uses: actions/checkout@v4
        with:
          ref: data 
          path: db_branch

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: GraphQL Deep Scan & Generate Report
        id: generate
        env:
          USER_INPUT: ${{ inputs.github_user }} 
          USER_ID: ${{ inputs.github_id }}
          REAL_NAME_INPUT: ${{ inputs.full_name }}
          GH_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          import urllib.request, urllib.parse, json, os, sys, re, time, math
          
          now = time.time()
          user = os.environ.get('USER_INPUT', '')
          user_id = os.environ.get('USER_ID', '')
          raw_name = os.environ.get('REAL_NAME_INPUT', '').strip()
          gh_token = os.environ.get('GH_TOKEN', '')
          ORG_NAMES = ['OWASP', 'GenAI-Security-Project']
          ORG_SET = {o.upper() for o in ORG_NAMES}
              
          cooldown_seconds = 86400
          
          cert_path = f"db_branch/certs/{user_id}.json"
          attempt_path = f"db_branch/attempts/{user_id}.json"

          def abort_with_error(msg, apply_limit=False):
              print(f"::error::{msg}")
              os.makedirs("db_branch/attempts", exist_ok=True)
              with open(attempt_path, "w", encoding="utf-8") as f:
                  json.dump({
                      "last_attempt": int(now), 
                      "status": "error", 
                      "message": str(msg),
                      "apply_limit": apply_limit
                  }, f)
              sys.exit(1)
              
          try:
              # Enforce cooldown period
              last_time = 0
              if os.path.exists(cert_path):
                  with open(cert_path, "r", encoding="utf-8") as f:
                      try: last_time = max(last_time, json.load(f).get("last_issued", 0))
                      except: pass
                      
              if os.path.exists(attempt_path):
                  with open(attempt_path, "r", encoding="utf-8") as f:
                      try: 
                          att_data = json.load(f)
                          if att_data.get("apply_limit") is True or "No verified commits" in att_data.get("message", ""):
                              last_time = max(last_time, att_data.get("last_attempt", 0))
                      except: pass
                      
              if cooldown_seconds > 0 and last_time > 0 and (now - last_time) < cooldown_seconds:
                  abort_with_error("Rate Limit Exceeded. Cooldown active.", apply_limit=True)

              # Validate user-provided real name
              if len(raw_name) > 20:
                  abort_with_error("Input Error: Name exceeds 20 characters.")
                  
              if re.search(r'[^\w\s.\-]', raw_name):
                  abort_with_error("Input Error: Name contains restricted characters.")
                  
              real_name = raw_name if raw_name else user

              headers = {
                  'Authorization': f'Bearer {gh_token}',
                  'Content-Type': 'application/json',
                  'User-Agent': 'OWASP-CRT-GraphQL'
              }

              # Smart Retry Mechanism for GitHub API Timeout / 502 errors
              def run_graphql(query, variables=None, max_retries=4):
                  payload = json.dumps({'query': query, 'variables': variables or {}}).encode('utf-8')
                  for attempt in range(max_retries):
                      req = urllib.request.Request('https://api.github.com/graphql', data=payload, headers=headers)
                      try:
                          with urllib.request.urlopen(req) as response:
                              result = json.loads(response.read().decode())
                              if 'errors' in result:
                                  err_str = str(result['errors'])
                                  if "timeout" in err_str.lower() or "502" in err_str:
                                      if attempt < max_retries - 1:
                                          time.sleep(2 ** (attempt + 1))
                                          continue
                                  abort_with_error(f"GraphQL Error: {err_str}")
                              return result
                      except urllib.error.HTTPError as e:
                          if e.code in [500, 502, 503, 504] and attempt < max_retries - 1:
                              time.sleep(2 ** (attempt + 1))
                              continue
                          abort_with_error(f"GraphQL Connection Error: HTTP {e.code}")
                      except Exception as e:
                          abort_with_error(f"GraphQL Connection Error: {e}")

              print(f"[*] Fetching ID for user: {user}...")
              id_query = """query($login: String!) { user(login: $login) { id } }"""
              id_res = run_graphql(id_query, {"login": user})
              
              if not id_res or 'errors' in id_res or not id_res.get('data', {}).get('user'):
                  abort_with_error(f"User Not Found: {user}")
                  
              graphql_author_id = id_res['data']['user']['id']
              unique_commits = {}

              # ==========================================
              # Phase 1a: 3-Layer Hybrid Architecture
              # ==========================================
              print("[*] Phase 1a: Discovering target repositories (Hybrid Search Strategy)...")
              target_repos_dict = {}
              search_failed_due_to_restriction = False
              search_headers = headers.copy()

              for org in ORG_NAMES:
                  print(f"[*] Searching for PRs by {user} in {org}...")
                  query_str = f"type:pr author:{user} org:{org}"
                  encoded_query = urllib.parse.quote(query_str)
                  search_url = f"https://api.github.com/search/issues?q={encoded_query}&per_page=100"
                  
                  req = urllib.request.Request(search_url, headers=search_headers)
                  try:
                      with urllib.request.urlopen(req) as response:
                          result = json.loads(response.read().decode())
                          for item in result.get('items', []):
                              repo_url = item.get('repository_url', '')
                              if not repo_url: continue
                              
                              parts = repo_url.split('/')
                              repo_name = parts[-1]
                              repo_owner = parts[-2]
                              repo_key = f"{repo_owner}/{repo_name}"
                              
                              if repo_key not in target_repos_dict:
                                  target_repos_dict[repo_key] = {"owner": repo_owner, "name": repo_name}
                                  print(f"    - [HIT-PlanA] Found PR activity: {repo_key}")
                                  
                  except urllib.error.HTTPError as e:
                      err_msg = ""
                      try: err_msg = e.read().decode()
                      except: pass
                      
                      if e.code == 422 and "users do not exist or you do not have permission" in err_msg:
                          print(f"    [!] GitHub Shadowban detected for {user}.")
                          search_failed_due_to_restriction = True
                          break
                      else:
                          print(f"    [!] Search API HTTP Error for {org}: {e.code}")
                  
                  time.sleep(2)

              # Plan B (GraphQL) & Plan C (Events API)
              if search_failed_due_to_restriction:
                  print("[*] Initializing Plan B (GraphQL) and Plan C (Events API) to bypass restrictions...")
                  
                  # Plan B: GraphQL (May return empty due to contribution graph manipulation)
                  repo_query = """
                  query($login: String!) { user(login: $login) { repositoriesContributedTo(first: 100, contributionTypes: [COMMIT]) { edges { node { name owner { login } } } } } }
                  """
                  try:
                      repo_res = run_graphql(repo_query, {"login": user})
                      contributed_repos = repo_res.get('data', {}).get('user', {}).get('repositoriesContributedTo', {}).get('edges', [])
                      for edge in contributed_repos:
                          owner = edge['node']['owner']['login']
                          name = edge['node']['name']
                          if owner.upper() in ORG_SET:
                              repo_key = f"{owner}/{name}"
                              target_repos_dict[repo_key] = {"owner": owner, "name": name}
                              print(f"    - [HIT-PlanB] Found via GraphQL: {repo_key}")
                  except Exception: pass

                  # Plan C: Raw Events API (Uncensored push/PR logs for the last 90 days)
                  print(f"[*] Scanning Raw Events API for {user}...")
                  events_url = f"https://api.github.com/users/{user}/events?per_page=100"
                  req = urllib.request.Request(events_url, headers=search_headers)
                  try:
                      with urllib.request.urlopen(req) as response:
                          events = json.loads(response.read().decode())
                          for event in events:
                              if event.get('type') in ['PushEvent', 'PullRequestEvent', 'IssuesEvent']:
                                  repo_full = event['repo']['name']
                                  owner, name = repo_full.split('/')
                                  if owner.upper() in ORG_SET and repo_full not in target_repos_dict:
                                      target_repos_dict[repo_full] = {"owner": owner, "name": name}
                                      print(f"    - [HIT-PlanC] Found via Raw Events: {repo_full}")
                  except Exception as e:
                      print(f"    [!] Events API failed: {e}")

              target_repos = list(target_repos_dict.values())
              print(f"[*] Found {len(target_repos)} target repositories dynamically.")

              # Phase 1b: Fetch commit history only for target repos (Default Branch)
              print(f"[*] Phase 1b: Fetching commit history for target repos...")
              commit_query = """
              query($owner: String!, $name: String!, $authorId: ID!) {
                repository(owner: $owner, name: $name) {
                  defaultBranchRef {
                    target {
                      ... on Commit {
                        history(author: { id: $authorId }, first: 100) {
                          edges {
                            node { oid additions deletions committedDate }
                          }
                        }
                      }
                    }
                  }
                }
              }
              """
              for repo in target_repos:
                  c_res = run_graphql(commit_query, {"owner": repo['owner'], "name": repo['name'], "authorId": graphql_author_id})
                  repo_node = c_res.get('data', {}).get('repository', {})
                  if not repo_node: continue
                  branch_ref = repo_node.get('defaultBranchRef')
                  if not branch_ref: continue
                      
                  commit_history = branch_ref.get('target', {}).get('history', {}).get('edges', [])
                  for commit_edge in commit_history:
                      c = commit_edge['node']
                      sha = c['oid']
                      unique_commits[sha] = {
                          'repo': f"{repo['owner']}/{repo['name']}",
                          'added': c['additions'],
                          'removed': c['deletions'],
                          'date': c['committedDate'],
                          'type': 'Direct'
                      }

              # Phase 2: Fetch valid PR merge commits (Multi-branch support)
              print("[*] Phase 2: Fetching valid PR merge commits (Multi-branch)...")
              pr_query = """
              query($searchQuery: String!) {
                search(query: $searchQuery, type: ISSUE, first: 100) {
                  edges {
                    node {
                      ... on PullRequest {
                        repository { nameWithOwner owner { login } }
                        mergeCommit {
                          oid additions deletions committedDate
                          authors(first: 10) {
                            edges {
                              node { user { login } }
                            }
                          }
                        }
                      }
                    }
                  }
                }
              }
              """
              pr_edges = []
              for org in ORG_NAMES:
                  search_str = f"is:pr is:merged author:{user} org:{org}"
                  pr_res = run_graphql(pr_query, {"searchQuery": search_str})
                  pr_edges.extend(pr_res.get('data', {}).get('search', {}).get('edges', []))
                  
              for pr_edge in pr_edges:
                  pr_node = pr_edge.get('node', {})
                  if not pr_node or not pr_node.get('repository'): continue
                  
                  repo_owner = pr_node['repository']['owner']['login']
                  if repo_owner.upper() not in ORG_SET: continue
                  
                  repo_name = pr_node['repository']['nameWithOwner']
                  merge_commit = pr_node.get('mergeCommit')
                  
                  if not merge_commit: continue
                      
                  sha = merge_commit['oid']
                  
                  is_author = False
                  authors_edges = merge_commit.get('authors', {}).get('edges', [])
                  for a_edge in authors_edges:
                      a_user = a_edge.get('node', {}).get('user', {})
                      if a_user and a_user.get('login', '').lower() == user.lower():
                          is_author = True
                          break
                          
                  if is_author and sha not in unique_commits:
                      unique_commits[sha] = {
                          'repo': repo_name,
                          'added': merge_commit['additions'],
                          'removed': merge_commit['deletions'],
                          'date': merge_commit['committedDate'],
                          'type': 'PR'
                      }

              total_commits = len(unique_commits)
              
              if total_commits == 0:
                  abort_with_error("No verified commits found in the OWASP or GenAI Security Project repositories.", apply_limit=True)

              total_added = sum(c['added'] for c in unique_commits.values())
              total_removed = sum(c['removed'] for c in unique_commits.values())
              
              raw_total = total_added + total_removed

              first_commit_date = min(c['date'] for c in unique_commits.values())
              first_commit_display = first_commit_date.split('T')[0] if first_commit_date else "N/A"

              # Normalization constants and scoring thresholds
              P99_ADD = 290764.32000000024
              P99_DEL = 130211.56000000004
              P99_CMT = 536.5200000000004
              OUTLIER_UPPER = 17.980652793952775

              SILVER_THRESHOLD = 0.000818
              GOLD_THRESHOLD = 0.006063

              log_raw = math.log1p(raw_total)
              
              if log_raw > OUTLIER_UPPER:
                  tier = "Gold"
                  final_score = "Exceptional"
              else:
                  add_norm = min(total_added / P99_ADD, 1.0) if P99_ADD > 0 else 0
                  del_norm = min(total_removed / P99_DEL, 1.0) if P99_DEL > 0 else 0
                  cmt_norm = min(total_commits / P99_CMT, 1.0) if P99_CMT > 0 else 0
                  
                  score = (add_norm * 0.50) + (del_norm * 0.40) + (cmt_norm * 0.10)
                  final_score = f"{score:.6f}"
                  
                  if score >= GOLD_THRESHOLD: tier = "Gold"
                  elif score >= SILVER_THRESHOLD: tier = "Silver"
                  else: tier = "Bronze"

              # Aggregate per-repository statistics
              repo_stats = {}
              for sha, data in unique_commits.items():
                  r_name = data['repo']
                  if r_name not in repo_stats:
                      repo_stats[r_name] = {'commits': 0, 'added': 0, 'removed': 0}
                      
                  repo_stats[r_name]['commits'] += 1
                  repo_stats[r_name]['added'] += data['added']
                  repo_stats[r_name]['removed'] += data['removed']

              total_projects = len(repo_stats)

              if os.path.exists(attempt_path):
                  try: os.remove(attempt_path)
                  except: pass

              cert_id = user_id
              
              payload = {
                  "id": cert_id,
                  "user": user, 
                  "real_name": real_name, 
                  "tier": tier,
                  "score": final_score,
                  "last_issued": int(now),
                  "stats": {
                      "first_commit_date": first_commit_display,
                      "merged_commits": str(total_commits),
                      "project_count": str(total_projects),
                      "lines_added": str(total_added), 
                      "lines_removed": str(total_removed)
                  }
              }
              
              os.makedirs("db_branch/certs", exist_ok=True)
              file_path = f"db_branch/certs/{cert_id}.json"
              with open(file_path, "w", encoding="utf-8") as f:
                  json.dump(payload, f, ensure_ascii=False, indent=2)
                  
              print(f"[*] Process complete. Certificate updated for {user}.")
          except Exception as e:
              abort_with_error(f"Internal Processing Error: {str(e)}")
        shell: python

      - name: Commit and Push Records to Data Branch
        if: always()
        run: |
          if [ -d "db_branch" ]; then
            cd db_branch
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            mkdir -p attempts certs
            git add -A attempts/ certs/ 2>/dev/null || true

            if git diff --staged --quiet; then
              echo "[*] No changes to commit."
              exit 0
            fi

            git commit -m "db(sys): update records for @${{ inputs.github_user }} [skip ci]"

            max_attempts=5
            attempt=1
            pushed=false

            while [ $attempt -le $max_attempts ]; do
              echo "[*] Push attempt $attempt/$max_attempts..."

              if git push origin data; then
                pushed=true
                break
              fi

              echo "[*] Push rejected, fetching + rebasing onto latest data branch..."
              git fetch origin data

              if ! git rebase origin/data; then
                echo "::error::Rebase conflict while saving certificate record."
                git rebase --abort
                break
              fi

              sleep $((RANDOM % 5 + 1))
              attempt=$((attempt + 1))
            done

            if [ "$pushed" = false ]; then
              echo "::error::Failed to push certificate record to data branch after $max_attempts attempts."
              exit 1
            fi
          fi
          
